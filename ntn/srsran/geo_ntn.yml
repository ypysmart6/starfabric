  band: 256
  channel_bandwidth_MHz: 5
  common_scs: 15
  plmn: "00101"
  tac: 7
  pdsch:
    nof_harqs: 16
    max_nof_harq_retxs: 0
  prach:
    prach_config_index: 31
    max_msg3_harq_retx: 0
  sib:
    t300: 2000
    t301: 2000
    t311: 3000
    t319: 2000
