# Replace the matching AMF sections in the upstream Open5GS configuration.
# The N2 address, PLMN, TAC and slices match ntn/srsran/gnb_transport.yml.
amf:
  ngap:
    server:
      - address: 10.53.1.2
  guami:
    - plmn_id: {mcc: "001", mnc: "01"}
      amf_id: {region: 2, set: 1}
  tai:
    - plmn_id: {mcc: "001", mnc: "01"}
      tac: 7
  plmn_support:
    - plmn_id: {mcc: "001", mnc: "01"}
      s_nssai:
        - {sst: 1}
        - {sst: 2, sd: "000001"}
