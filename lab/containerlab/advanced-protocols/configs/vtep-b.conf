frr defaults traditional
hostname vtep-b
service integrated-vtysh-config
log stdout informational
!
interface lo
 ip address 10.255.1.2/32
 ip ospf area 0.0.0.0
 ip ospf passive
!
interface eth1
 ip address 10.1.12.1/31
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 3
!
interface eth2
 ip address 10.1.13.1/31
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 20
 ip ospf hello-interval 1
 ip ospf dead-interval 3
!
router ospf
 ospf router-id 10.255.1.2
 timers throttle spf 0 50 500
!
router bgp 65100
 bgp router-id 10.255.1.2
 neighbor 10.255.1.1 remote-as 65100
 neighbor 10.255.1.1 update-source lo
 !
 address-family l2vpn evpn
  neighbor 10.255.1.1 activate
  advertise-all-vni
 exit-address-family
!
line vty

