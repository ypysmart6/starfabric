frr defaults traditional
hostname control-primary
service integrated-vtysh-config
log stdout informational
!
interface lo
 ip address 10.255.0.2/32
 ipv6 address 2001:db8:ffff::2/128
 ip router isis SF
 ipv6 router isis SF
 isis passive
!
interface eth1
 ip address 10.0.12.1/31
 ipv6 address 2001:db8:12::2/64
 ip router isis SF
 ipv6 router isis SF
 isis network point-to-point
 isis metric level-2 10
 isis hello-interval 1
 isis hello-multiplier 3
 link-params
  max-bw 125000000
 exit-link-params
!
interface eth2
 ip address 10.0.24.0/31
 ipv6 address 2001:db8:24::1/64
 ip router isis SF
 ipv6 router isis SF
 isis network point-to-point
 isis metric level-2 10
 isis hello-interval 1
 isis hello-multiplier 3
 link-params
  max-bw 125000000
 exit-link-params
!
router isis SF
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
 mpls-te on
 mpls-te router-address 10.255.0.2
 segment-routing srv6
  locator PRIMARY
 exit
exit
!
segment-routing
 srv6
  locators
   locator PRIMARY
    prefix fc00:0:2::/64
   exit
  exit
 exit
exit
!
line vty
