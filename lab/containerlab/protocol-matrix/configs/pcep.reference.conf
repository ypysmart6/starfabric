! SR-TE/PCEP is enabled only on a pinned FRR pathd build and against a supplied
! stateful PCE. Replace the example addresses, labels and runtime secret.
segment-routing
 traffic-eng
  mpls-te on
  mpls-te import isis
  segment-list SF-PRIMARY
   index 10 mpls label 16002
   index 20 mpls label 16003
  !
  policy color 100 endpoint 10.255.0.3
   name STARFABRIC
   binding-sid 24000
   candidate-path preference 100 name CONTACT-PLAN explicit segment-list SF-PRIMARY
   candidate-path preference 200 name PCE-DYNAMIC dynamic
    bandwidth 100000000 required
    metric bound pd 50000 required
   !
  !
  pcep
   pce-config SF-PCE-CONFIG
    source-address 10.255.0.1
    tcp-md5-auth injected-by-secret-manager
   !
   pce SF-PCE
    config SF-PCE-CONFIG
    address ip 10.255.0.254
    pce-initiated
   !
   pcc
    peer SF-PCE precedence 100
   !
  !
 !
!
route-map SET-SF-SR-POLICY permit 10
 set sr-te color 100
