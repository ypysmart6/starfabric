frr defaults traditional
hostname r3
service integrated-vtysh-config
log stdout informational
!
bfd
 profile FAST
  detect-multiplier 3
  receive-interval 100
  transmit-interval 100
 exit
!
interface lo
 ip address 10.255.0.3/32
 ip router isis SF
 isis passive
!
interface eth1
 ip address 10.0.13.1/31
 ip router isis SF
 isis network point-to-point
 isis metric level-2 20
 isis bfd
 isis bfd profile FAST
!
interface eth2
 ip address 10.0.34.0/31
 ip router isis SF
 isis network point-to-point
 isis metric level-2 20
 isis bfd
 isis bfd profile FAST
!
interface eth3
 ip address 10.0.23.1/31
 ip router isis SF
 isis network point-to-point
 isis metric level-2 15
 isis bfd
 isis bfd profile FAST
!
router isis SF
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
 log-adjacency-changes
!
line vty
