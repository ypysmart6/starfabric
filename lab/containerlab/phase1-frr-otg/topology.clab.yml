name: sf-phase1

topology:
  defaults:
    kind: linux
  nodes:
    otgc:
      image: ghcr.io/open-traffic-generator/keng-controller:1.61.0-9
      cmd: --accept-eula --http-port 8443
      ports:
        - 8443:8443
    otg-a:
      image: ghcr.io/open-traffic-generator/ixia-c-traffic-engine:1.8.0.544
      exec:
        - ip address add 192.0.2.2/24 dev eth1
        - ip route add 198.51.100.0/24 via 192.0.2.1
      env:
        OPT_LISTEN_PORT: 5555
        ARG_IFACE_LIST: virtual@af_packet,eth1
        OPT_NO_HUGEPAGES: Yes
        OPT_NO_PINNING: Yes
        WAIT_FOR_IFACE: Yes
    r1:
      image: quay.io/frrouting/frr@sha256:65e5967b922572c0565d968388fb06af69d7e9b3b3eea40ad7e3810687667f68
      sysctls: {net.ipv4.ip_forward: 1}
      binds: &r1binds
        - configs/daemons:/etc/frr/daemons:ro
        - configs/vtysh.conf:/etc/frr/vtysh.conf:ro
        - configs/r1.conf:/etc/frr/frr.conf:ro
    r2:
      image: quay.io/frrouting/frr@sha256:65e5967b922572c0565d968388fb06af69d7e9b3b3eea40ad7e3810687667f68
      sysctls: {net.ipv4.ip_forward: 1}
      binds:
        - configs/daemons:/etc/frr/daemons:ro
        - configs/vtysh.conf:/etc/frr/vtysh.conf:ro
        - configs/r2.conf:/etc/frr/frr.conf:ro
    r3:
      image: quay.io/frrouting/frr@sha256:65e5967b922572c0565d968388fb06af69d7e9b3b3eea40ad7e3810687667f68
      sysctls: {net.ipv4.ip_forward: 1}
      binds:
        - configs/daemons:/etc/frr/daemons:ro
        - configs/vtysh.conf:/etc/frr/vtysh.conf:ro
        - configs/r3.conf:/etc/frr/frr.conf:ro
    r4:
      image: quay.io/frrouting/frr@sha256:65e5967b922572c0565d968388fb06af69d7e9b3b3eea40ad7e3810687667f68
      sysctls: {net.ipv4.ip_forward: 1}
      binds:
        - configs/daemons:/etc/frr/daemons:ro
        - configs/vtysh.conf:/etc/frr/vtysh.conf:ro
        - configs/r4.conf:/etc/frr/frr.conf:ro
    otg-b:
      image: ghcr.io/open-traffic-generator/ixia-c-traffic-engine:1.8.0.544
      exec:
        - ip address add 198.51.100.2/24 dev eth1
        - ip route add 192.0.2.0/24 via 198.51.100.1
      env:
        OPT_LISTEN_PORT: 5555
        ARG_IFACE_LIST: virtual@af_packet,eth1
        OPT_NO_HUGEPAGES: Yes
        OPT_NO_PINNING: Yes
        WAIT_FOR_IFACE: Yes
  links:
    - endpoints: ["otg-a:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r1:eth3", "r3:eth1"]
    - endpoints: ["r2:eth2", "r4:eth1"]
    - endpoints: ["r3:eth2", "r4:eth2"]
    - endpoints: ["r2:eth3", "r3:eth3"]
    - endpoints: ["r4:eth3", "otg-b:eth1"]
