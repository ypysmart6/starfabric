!RANCID-CONTENT-TYPE: cisco
version 15.2
hostname r1
!
interface Loopback0
 ip address 10.255.0.1 255.255.255.255
!
interface Ethernet1
 ip address 192.0.2.1 255.255.255.0
 no shutdown
!
interface Ethernet2
 ip address 10.0.12.0 255.255.255.254
 no shutdown
!
interface Ethernet3
 ip address 10.0.13.0 255.255.255.254
 no shutdown
!
ip route 198.51.100.0 255.255.255.0 10.0.12.1
ip route 198.51.100.0 255.255.255.0 10.0.13.1 10
!
end
