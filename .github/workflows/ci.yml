name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - run: go fmt ./...
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      - id: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false
      - run: python3 tools/verify_coverage.py
      - run: python3 -m unittest ntn.test_experiment ntn.test_lab_lifecycle
      - run: python3 -m unittest tools.test_single_pc
      - run: python3 tools/single_pc.py plan
      - run: go run ./cmd/sfctl experiment run --scenario scenarios/leo-resilient.json --output reports/ci.json --html reports/ci.html
      - run: python3 -m py_compile tools/*.py ntn/*.py lab/linux-networking/*.py lab/containerlab/phase1-frr-otg/*.py lab/containerlab/protocol-matrix/*.py lab/orbit-closed-loop/*.py lab/batfish/*.py lab/p4/*.py
      - run: for manifest in ntn/experiments/*.json; do python3 ntn/experiment.py --manifest "$manifest" --validate-only; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starfabric-report
          path: reports/
  onboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo test --locked --manifest-path onboard/Cargo.toml
