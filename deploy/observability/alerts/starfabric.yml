groups:
  - name: starfabric
    rules:
      - alert: StarFabricDesiredActualMismatch
        expr: starfabric_desired_actual_mismatch > 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: StarFabric desired and actual forwarding state differ
      - alert: StarFabricReconciliationFailures
        expr: increase(starfabric_reconcile_failure_total[5m]) > 2
        labels: {severity: warning}
        annotations:
          summary: Repeated StarFabric reconciliation failures
      - alert: StarFabricNoActiveLinks
        expr: starfabric_active_links == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: StarFabric topology reports no active links

