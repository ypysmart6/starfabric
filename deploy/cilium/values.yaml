kubeProxyReplacement: true
hubble:
  relay: {enabled: true}
  ui: {enabled: true}
  metrics:
    enabled: [dns, drop, tcp, flow, icmp, httpV2]
    serviceMonitor: {enabled: true}
prometheus: {enabled: true, serviceMonitor: {enabled: true}}
operator: {prometheus: {enabled: true, serviceMonitor: {enabled: true}}}
