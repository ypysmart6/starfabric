services:
  controller:
    build:
      context: ../..
    command: ["--scenario=/config/scenario.json", "--state-dir=/data", "--listen=:8080", "--health-listen=:8081", "--log-file=/data/controller.log", "--otlp-endpoint=otel-collector:4318", "--otlp-insecure"]
    ports:
      - "127.0.0.1:${STARFABRIC_API_PORT:-8080}:8080"
    volumes:
      - controller-data:/data
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [control]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    user: "65532:65532"
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - controller-data:/var/log/starfabric:ro
    ports:
      - "127.0.0.1:${STARFABRIC_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${STARFABRIC_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${STARFABRIC_OTEL_HEALTH_PORT:-13133}:13133"
    restart: unless-stopped
    depends_on: [tempo, loki]
    networks: [control]

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${STARFABRIC_TEMPO_PORT:-3200}:3200"
    restart: unless-stopped
    networks: [control]

  loki:
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ../observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${STARFABRIC_LOKI_PORT:-3100}:3100"
    restart: unless-stopped
    networks: [control]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${STARFABRIC_PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    networks: [control]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${STARFABRIC_GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    networks: [control]

networks:
  control: {}
volumes:
  controller-data: {}
  prometheus-data: {}
  grafana-data: {}
  tempo-data: {}
  loki-data: {}
