name: sf-l01-data-plane

topology:
  defaults:
    kind: linux
    image: ghcr.io/srl-labs/network-multitool@sha256:9bc1e46dd105a054bce724b6744200e951e8fdf4c17658912fbc54fd2e8a4b06

  nodes:
    h1:
      exec:
        - ip address add 10.0.1.2/24 dev eth1
        - ip link set eth1 up
        - ip route replace 10.0.2.0/24 via 10.0.1.1 dev eth1

    r1:
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - ip address add 10.0.1.1/24 dev eth1
        - ip address add 10.0.2.1/24 dev eth2
        - ip link set eth1 up
        - ip link set eth2 up

    h2:
      exec:
        - ip address add 10.0.2.2/24 dev eth1
        - ip link set eth1 up
        - ip route replace 10.0.1.0/24 via 10.0.2.1 dev eth1

  links:
    - endpoints: ["h1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "h2:eth1"]
